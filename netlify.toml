[build]
  command = "npm run build"
  publish = "dist"

# Prevent caching of HTML pages - browsers must revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = ["admin"]}

# Handle SPA routing
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
